    <text x="125" y="83" text-anchor="middle" class="white-body">认证与密码安全</text>
    <text x="125" y="113" text-anchor="middle" class="muted">已实现</text>
  </g>
  <g transform="translate(1020,1410)">
    <rect width="250" height="165" rx="12" fill="url(#purple)"/>
    <text x="125" y="46" text-anchor="middle" class="white-title">Redis + BullMQ</text>
    <text x="125" y="83" text-anchor="middle" class="white-body">缓存与异步任务队列</text>
    <text x="125" y="113" text-anchor="middle" class="muted">规划扩展</text>
  </g>
  <g transform="translate(1285,1410)">
