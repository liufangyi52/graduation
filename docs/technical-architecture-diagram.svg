    <text x="30" y="72" class="card-small">确认会议所属项目与操作者权限</text>
  </g>
  <g transform="translate(550,685)">
    <rect class="green-card" width="305" height="115" rx="12"/>
    <text x="30" y="40" class="card-title">内容格式校验</text>
    <text x="30" y="72" class="card-small">标题、正文、时间、参会信息检查</text>
  </g>
  <g transform="translate(875,685)">
    <rect class="green-card" width="305" height="115" rx="12"/>
    <text x="30" y="40" class="card-title">脱敏预处理</text>
    <text x="30" y="72" class="card-small">敏感信息替换与操作留痕</text>
