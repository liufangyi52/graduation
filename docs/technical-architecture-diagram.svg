  <rect x="18" y="614" width="180" height="735" rx="16" fill="url(#green)"/>
  <text x="108" y="910" text-anchor="middle" class="layer-cn">Agent 协同层</text>
  <text x="108" y="948" text-anchor="middle" class="layer-en">Agent</text>
  <text x="108" y="975" text-anchor="middle" class="layer-en">Collaboration</text>
  <text x="108" y="1002" text-anchor="middle" class="layer-en">Layer</text>

  <text x="225" y="664" class="section-title">Agent 1：会议纪要接收与校验</text>
  <g transform="translate(225,685)">
