  <rect width="1600" height="2200" fill="url(#bg)"/>
  <text x="800" y="60" text-anchor="middle" class="title">基于会议纪要智能体的任务抽取与项目进度跟踪系统技术架构图</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">Meeting Minutes Agent · Task Extraction · Project Progress Tracking</text>

  <!-- Input Layer -->
