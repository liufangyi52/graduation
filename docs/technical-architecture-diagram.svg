<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061b3a"/>
      <stop offset="100%" stop-color="#082a4d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ff4f0f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d7c69"/>
      <stop offset="100%" stop-color="#075b50"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a14ce6"/>
      <stop offset="100%" stop-color="#6d2eb5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00122a" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { font: 700 36px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 500 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #c8d9f2; letter-spacing: 1px; }
      .layer-cn { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .layer-en { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .card-title { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f2140; }
      .card-body { font: 500 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24334d; }
      .card-small { font: 500 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #34445f; }
      .section-title { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #075b50; }
      .white-title { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .white-body { font: 500 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #f4f7ff; }
      .muted { font: 500 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #e6eefb; }
      .box { fill: rgba(255,255,255,0.92); stroke: #d6dfec; stroke-width: 1.4; }
      .green-card { fill: rgba(244,255,250,0.88); stroke: #69b7a8; stroke-width: 1.4; }
      .blue-card { fill: rgba(244,248,255,0.92); stroke: #b7c7dd; stroke-width: 1.4; }
      .line { stroke: #8fb4cc; stroke-width: 2; fill: none; marker-end: url(#arrow); }
