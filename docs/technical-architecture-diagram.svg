  <rect x="18" y="382" width="180" height="210" rx="16" fill="#f27317"/>
  <text x="108" y="462" text-anchor="middle" class="layer-cn">Agent 编排层</text>
  <text x="108" y="497" text-anchor="middle" class="layer-en">Orchestration</text>
  <text x="108" y="524" text-anchor="middle" class="layer-en">Layer</text>
  <rect x="420" y="427" width="760" height="120" rx="12" fill="url(#orange)"/>
  <text x="800" y="475" text-anchor="middle" class="white-title">meetingflow_api / NestJS</text>
