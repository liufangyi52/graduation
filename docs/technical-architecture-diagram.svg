  <rect x="18" y="120" width="180" height="240" rx="16" fill="#0b2c59"/>
  <text x="108" y="217" text-anchor="middle" class="layer-cn">输入层</text>
  <text x="108" y="252" text-anchor="middle" class="layer-en">Input Layer</text>

  <g transform="translate(225,155)">
    <rect class="box" width="250" height="160" rx="12"/>
    <text x="125" y="42" text-anchor="middle" class="card-title">会议纪要文本</text>
    <text x="125" y="78" text-anchor="middle" class="card-body">粘贴 / 上传 / 导入</text>
    <text x="125" y="108" text-anchor="middle" class="card-small">结构化与半结构化内容</text>
  </g>
  <g transform="translate(490,155)">
    <rect class="box" width="250" height="160" rx="12"/>
