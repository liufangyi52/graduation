    <text x="125" y="108" text-anchor="middle" class="card-small">计划时间与里程碑</text>
  </g>
  <g transform="translate(755,155)">
    <rect class="box" width="250" height="160" rx="12"/>
    <text x="125" y="42" text-anchor="middle" class="card-title">任务进度反馈</text>
    <text x="125" y="78" text-anchor="middle" class="card-body">状态 / 进度 / 问题</text>
    <text x="125" y="108" text-anchor="middle" class="card-small">成员工作反馈闭环</text>
  </g>
  <g transform="translate(1020,155)">
    <rect class="box" width="250" height="160" rx="12"/>
