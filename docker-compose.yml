services:
  web:
    build: ./apps/web
    ports: ["8080:80"]
    depends_on: [api]
  api:
    build: ./apps/api
    environment:
      PORT: 3000
      AI_SERVICE_URL: http://ai:8000
    ports: ["3000:3000"]
    depends_on: [ai, mysql, redis]
  ai:
    build: ./apps/ai
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
    ports: ["8000:8000"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meetingflow}
      MYSQL_USER: ${MYSQL_USER:-meetingflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meetingflow_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: meetingflow
      MINIO_ROOT_PASSWORD: meetingflow-dev-password
    ports: ["9000:9000", "9001:9001"]
volumes:
  mysql-data:
