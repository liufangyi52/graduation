<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetingFlow 高保真原型图</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #fff; background: #101828; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { width: 1440px; height: 900px; padding: 144px 106px; position: relative; overflow: hidden; }
      .brand { display: flex; align-items: center; gap: 20px; font-size: 27px; font-weight: 700; }.mark { display: grid; width: 54px; height: 54px; place-items: center; border-radius: 10px; background: #155eef; font-size: 26px; }
      .subtitle { margin: 170px 0 15px; color: #d0d5dd; font-size: 23px; }.title { margin: 0; font-size: 50px; letter-spacing: 0; }.meta { margin-top: 24px; color: #98a2b3; font-size: 18px; }.roles { display: flex; gap: 10px; margin-top: 42px; }.roles span { padding: 8px 12px; border: 1px solid #344054; border-radius: 5px; color: #d0d5dd; font-size: 13px; }.footer { position: absolute; right: 106px; bottom: 120px; left: 106px; padding-top: 28px; border-top: 1px solid #344054; color: #98a2b3; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark">M</span><span>MeetingFlow</span></div>
      <p class="subtitle">基于会议纪要智能体的任务抽取与项目进度跟踪系统</p>
      <h1 class="title">高保真原型图设计</h1>
      <p class="meta">版本 1.0 · 2026-08-16 · 桌面端 1440 × 900</p>
      <div class="roles"><span>项目经理</span><span>项目成员</span><span>系统管理员</span><span>审计人员</span></div>
      <p class="footer">会议纪要导入 · AI 解析复核 · 任务协同 · 风险预警 · 审计追溯</p>
    </main>
  </body>
</html>
